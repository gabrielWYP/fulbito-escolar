<!DOCTYPE html>
<html lang="es-PE" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Copa Escolar de Fulbito{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="/">
        <span class="brand-ball" aria-hidden="true">⚽</span>
        <span>Copa Escolar de Fulbito</span>
      </a>
      <nav class="mainnav" aria-label="Navegación principal">
        <a href="/">Inicio</a>
        <a href="/colegios">Colegios</a>
        {% if admin %}
          <a href="/admin">Administración</a>
        {% elif admin_enabled %}
          <a href="/admin/login">Ingresar</a>
        {% endif %}
        <button id="theme-toggle" class="theme-btn" type="button"
                aria-label="Cambiar tema claro/oscuro">🌓</button>
      </nav>
    </div>
  </header>

  <main id="contenido" class="container" role="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">
      <p>Copa Escolar de Fulbito · Gestión de campeonato escolar de futsal</p>
    </div>
  </footer>

  <script src="/static/app.js" defer></script>
</body>
</html>
